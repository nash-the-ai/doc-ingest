name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14  # Apple Silicon
            target: macos-arm64
          - os: macos-13  # Intel Mac
            target: macos-x64
          - os: ubuntu-latest
            target: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr libmagic-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install poppler tesseract libmagic

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build binary with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --name doc-ingest-${{ matrix.target }} \
            --collect-all chromadb \
            --collect-all sentence_transformers \
            --collect-all unstructured \
            --hidden-import=chromadb.api.segment \
            --hidden-import=tiktoken_ext.openai_public \
            --hidden-import=tiktoken_ext \
            src/doc_ingest/cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: doc-ingest-${{ matrix.target }}
          path: dist/doc-ingest-${{ matrix.target }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: binaries/*
          generate_release_notes: true

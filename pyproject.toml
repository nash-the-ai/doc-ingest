[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-ingest"
version = "0.1.0"
description = "Point at a directory of documents. Get a RAG-ready vector store."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nash" },
]
keywords = ["rag", "documents", "vector-store", "embeddings", "unstructured", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
dependencies = [
    "unstructured[all-docs]>=0.12.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
doc-ingest = "doc_ingest.cli:main"

[project.urls]
Homepage = "https://github.com/nash-the-ai/doc-ingest"
Repository = "https://github.com/nash-the-ai/doc-ingest"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_ingest"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
